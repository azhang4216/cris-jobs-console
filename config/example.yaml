# Copy into ignored deploy/private/operator.yaml or config/local.yaml.
# All site-specific values below are examples, never real cluster credentials.
mode: ssh
state_dir: /var/lib/dmasif-console
submissions_enabled: false
operator_contact: "Your lab operator: operator@example.org"
poll_seconds: 30
dashboard_poll_seconds: 15
repository:
  id: 123456789
  full_name: YOUR_LAB/dMaSIF
  clone_url: https://github.com/YOUR_LAB/dMaSIF.git
allowed_actor_ids: [11111, 22222, 33333, 44444]
hook_id: dmasif-lab-push
# Public read-only viewing needs no password. Supply the webhook secret through
# DMASIF_WEBHOOK_SECRET or DMASIF_WEBHOOK_SECRET_FILE, never in this config.
datasets:
  demo-1stp-v1:
    description: "Registered 1STP extraction smoke test"
    merge_models: false
    entries:
      - path: /srv/lab/inputs/1STP.pdb
        sha256: REPLACE_WITH_INPUT_SHA256
        chains: null
presets:
  quick-test:
    gpus: 1
    cpus: 8
    memory_gb: 64
    wall_minutes: 15
    qos: test
    max_atoms: 150000
    max_proteins: 16
cluster:
  host: login.example.invalid
  user: service-user
  root: /srv/lab/job_console
  helper_path: /srv/lab/job_console/releases/adapters/v1/helper.py
  account: lab-account
  partition: gpu
  # Operator-only: use the site's exact GRES type for the tested runtime.
  # null permits any GPU model; it does not guarantee runtime compatibility.
  gpu_type: nvidia_h100_80gb_hbm3  # Example H100 type; verify at your site.
  qos: test
  runtime_image: /srv/lab/job_console/releases/containers/APPROVED.sif
  runtime_sha256: REPLACE_WITH_RUNTIME_SHA256
  runtime_unsquash: false  # Enable only if the site's Apptainer cannot mount SIFs.
  checkpoint_path: /srv/lab/checkpoints/APPROVED
  checkpoint_sha256: REPLACE_WITH_CHECKPOINT_SHA256
  adapter_version: v1
# SSH key and verified known_hosts use DMASIF_SSH_KEY / DMASIF_KNOWN_HOSTS.
queue_limit: 100
max_source_bytes: 52428800
max_input_bytes: 52428800
max_artifact_bytes: 10485760
max_run_artifact_bytes: 52428800
max_cache_bytes: 1073741824
min_free_bytes: 268435456
log_tail_bytes: 65536
