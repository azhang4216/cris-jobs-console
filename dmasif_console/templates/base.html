<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Runs{% endblock %}</title>
    <link rel="stylesheet" href="/static/console.css">
    <script src="/static/console.js" defer></script>
  </head>
  <body data-page="{% block page %}history{% endblock %}" data-poll-seconds="{{ settings.get('poll_seconds', 8) }}" data-api-base-url="{{ settings.get('api_base_url', '') }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="main-shell">
      {% if settings.get('mode') in ['fake', 'demo', 'local'] %}
      <div class="demo-banner">Demo · simulated data</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span id="connection-state" role="status">Updates automatically</span>
      <span>Times in <strong data-timezone>UTC</strong></span>
    </footer>
  </body>
</html>
