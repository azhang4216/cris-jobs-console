[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dmasif-console"
version = "0.1.0"
description = "A small, durable GitHub-to-Slurm research console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
dmasif-console = "dmasif_console.cli:main"

[tool.setuptools.packages.find]
include = ["dmasif_console*", "cluster_adapter*"]

[tool.setuptools.package-data]
dmasif_console = ["templates/*.html", "static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
