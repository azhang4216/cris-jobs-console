# One paid application, one disk. No separate database or worker service.
# Render prompts for sync:false values when creating a Blueprint.
# Never paste actual values into this file or commit operator.yaml.
services:
  - type: web
    name: dmasif-console
    runtime: docker
    # Small-lab pilot; check memory during submission before increasing limits.
    plan: 0.5c-512mb
    region: virginia
    branch: main
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # Bootstrap writes private runtime files, then starts supervised web + worker.
    autoDeployTrigger: "off"
    numInstances: 1
    healthCheckPath: /healthz
    # Disk-backed services use Render's default shutdown delay.
    disk:
      name: console-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "10000"
      - key: DMASIF_CONFIG
        value: /home/console/.config/dmasif-console/operator.yaml
      - key: DMASIF_STATE_DIR
        value: /var/data/state
      - key: DMASIF_SSH_KEY
        value: /home/console/.config/dmasif-console/cluster-key
      - key: DMASIF_KNOWN_HOSTS
        value: /home/console/.config/dmasif-console/known-hosts
      - key: DMASIF_REPOSITORY_TOKEN_FILE
        value: /home/console/.config/dmasif-console/repository-token
      - key: GIT_ASKPASS
        value: /usr/local/bin/dmasif-git-askpass
      - key: GIT_TERMINAL_PROMPT
        value: "0"
      - key: DMASIF_BACKUP_DIR
        value: /var/data/backups
      - key: DMASIF_BACKUP_INTERVAL_SECONDS
        value: "86400"
      - key: DMASIF_BACKUP_KEEP
        value: "3"
      - key: DMASIF_WEBHOOK_SECRET
        sync: false
      # Full private YAML configuration, including cluster host/user/paths.
      - key: DMASIF_OPERATOR_YAML
        sync: false
      # Paste the whole private key, including BEGIN/END lines and line breaks.
      - key: DMASIF_SSH_PRIVATE_KEY
        sync: false
      # Verified known_hosts entry; do not derive trust from a fresh ssh-keyscan.
      - key: DMASIF_SSH_KNOWN_HOSTS
        sync: false
      # Fine-grained token: Contents:Read for the private research repository.
      - key: DMASIF_REPOSITORY_TOKEN
        sync: false
